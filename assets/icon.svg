<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.55" stop-color="#c9ced6"/>
      <stop offset="1" stop-color="#9aa1ac"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f38"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#3a6ea8"/>
      <stop offset="0.45" stop-color="#132238"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe08a"/>
      <stop offset="1" stop-color="#2fb35f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- door station body -->
  <g filter="url(#sh)">
    <rect x="120" y="70" width="190" height="372" rx="40" fill="url(#panel)"/>
  </g>
  <rect x="140" y="92" width="150" height="328" rx="26" fill="url(#face)"/>
  <!-- camera -->
  <circle cx="215" cy="150" r="34" fill="#0b0d11" stroke="#3b414c" stroke-width="5"/>
  <circle cx="215" cy="150" r="22" fill="url(#lens)"/>
  <circle cx="207" cy="142" r="6" fill="#ffffff" opacity="0.75"/>
  <!-- speaker grille -->
  <g fill="#4a515d">
    <rect x="172" y="214" width="86" height="9" rx="4.5"/>
    <rect x="172" y="234" width="86" height="9" rx="4.5"/>
    <rect x="172" y="254" width="86" height="9" rx="4.5"/>
    <rect x="172" y="274" width="86" height="9" rx="4.5"/>
  </g>
  <!-- call button with red ring -->
  <circle cx="215" cy="358" r="34" fill="#1b1f26" stroke="#e53935" stroke-width="7"/>
  <circle cx="215" cy="358" r="19" fill="#c7ccd4"/>
  <!-- two-way sound waves -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="20">
    <path d="M 340 196 A 70 70 0 0 1 340 300"/>
    <path d="M 378 160 A 118 118 0 0 1 378 336"/>
  </g>
</svg>

play_test_tone:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dahua_vto_talk
    seconds:
      default: 3
      selector:
        number:
          min: 0.5
          max: 20
          step: 0.5
          unit_of_measurement: s
    frequency:
      default: 800
      selector:
        number:
          min: 100
          max: 3500
          unit_of_measurement: Hz
    transport:
      default: rtsp
      selector:
        select:
          options:
            - rtsp
            - http
    packet_bytes:
      selector:
        select:
          options:
            - "160"
            - "320"
            - "512"
            - "1024"
    zero_timestamp:
      selector:
        boolean:

play_media:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dahua_vto_talk
    media_content_id:
      required: true
      selector:
        text:

fix_codec:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dahua_vto_talk

stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dahua_vto_talk

ring:
  name: Show the call popup
  description: Shows "someone is ringing" on every open Home Assistant screen that has the card loaded (as if the doorbell was pressed).
  fields:
    config_entry_id:
      name: Door station
      required: false
      selector:
        config_entry:
          integration: dahua_vto_talk

dismiss:
  name: Close the call popup
  description: Ends the ringing / call state and closes the popup everywhere.
  fields:
    config_entry_id:
      name: Door station
      required: false
      selector:
        config_entry:
          integration: dahua_vto_talk
